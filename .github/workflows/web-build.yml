# SCRUM-59: every playtest build and the final build come from this pipeline.
#
# - On every push to main, every pull request, and manual runs: run the
#   smoke tests, export the "Web" preset with Godot 4.7.2, and upload the
#   build as a workflow artifact.
# - Publish to itch.io with butler only on manual runs with "publish"
#   ticked or on version tags (v*), and only when the repository has the
#   BUTLER_API_KEY secret and the ITCH_TARGET variable (e.g. user/aggieware:html5).
name: Web build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to itch.io"
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-web

      - name: Install Godot and web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          # Keep only the web templates so the cache stays small.
          unzip -q -j /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d "$dest"
          ls -l "$dest"

      - name: Smoke tests and web export
        env:
          GODOT: /home/runner/godot/godot
        run: bash tools/build_web.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aggieware-web-${{ github.sha }}
          path: build/web
          retention-days: 14

      - name: Publish to itch.io
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/v')
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo "::warning::BUTLER_API_KEY secret or ITCH_TARGET variable not set; skipping itch.io publish."
            exit 0
          fi
          curl -fsSL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q /tmp/butler.zip -d ~/butler
          chmod +x ~/butler/butler
          ~/butler/butler push build/web "$ITCH_TARGET" --userversion "$(git rev-parse --short HEAD)"
